        function init() {
            const sidebarList = document.getElementById('sidebarList');
            const chaptersContainer = document.getElementById('chaptersContainer');

            chapters.forEach((name, idx) => {
                const item = document.createElement('div');
                item.className = `sidebar-item ${idx === 0 ? 'active' : ''}`;
                item.textContent = name;
                item.onclick = () => show(idx);
                sidebarList.appendChild(item);

                const div = document.createElement('div');
                div.id = `ch-${idx}`;
                div.className = `chapter ${idx === 0 ? 'active' : ''}`;
                
                const content = data[name];
                const parts = content.split('================================================================================');
                const bodyPart = parts[0];
                const conclusionPart = parts.length > 1 ? parts.slice(1).join('================================================================================') : '';
                
                let html = `<h2 class="chapter-title">${name}</h2>`;
                html += `<div class="chapter-body">${bodyPart.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>`;
                
                if (conclusionPart.trim()) {
                    const conclusionLines = conclusionPart.trim().split('\n').filter(l => l.trim());
                    html += '<div class="conclusion-box">';
                    for (const line of conclusionLines) {
                        const trimmed = line.trim();
                        if (trimmed.startsWith('【')) {
                            html += `<strong>${trimmed}</strong>`;
                        } else if (trimmed.startsWith('💡')) {
                            html += `<div class="tip">${trimmed}</div>`;
                        } else if (trimmed && !trimmed.startsWith('  ')) {
                            html += `<p>${trimmed}</p>`;
                        } else if (trimmed) {
                            html += `<p style="margin-left: 20px;">${trimmed}</p>`;
                        }
                    }
                    html += '</div>';
                }
                
                div.innerHTML = html;
                chaptersContainer.appendChild(div);
            });
        }

        function show(idx) {
            document.querySelectorAll('.chapter').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`ch-${idx}`).classList.add('active');
            document.querySelectorAll('.sidebar-item')[idx].classList.add('active');
            document.getElementById('searchResults').classList.remove('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function search() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            if (!q) {
                document.getElementById('searchResults').classList.remove('active');
                return;
            }

            const results = [];
            for (const [name, content] of Object.entries(data)) {
                if (content.toLowerCase().includes(q)) {
                    const idx = content.toLowerCase().indexOf(q);
                    const start = Math.max(0, idx - 60);
                    const end = Math.min(content.length, idx + q.length + 60);
                    let snippet = content.substring(start, end);
                    snippet = snippet.replace(new RegExp(q, 'gi'), m => `<span class="highlight">${m}</span>`);
                    results.push({name, snippet});
                }
            }

            const html = results.length
                ? results.map(r => `<div class="result-item"><div class="result-title">${r.name}</div><div>...${r.snippet}...</div></div>`).join('')
                : '<div style="text-align: center; padding: 40px;">未找到結果</div>';

            document.getElementById('resultsContainer').innerHTML = html;
            document.getElementById('searchResults').classList.add('active');
        }

        document.getElementById('searchInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') search();
        });

        init();
    </script>
